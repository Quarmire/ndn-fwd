[package]
name = "ndn-fwd-tokens"
description = "Operator CLI for invites at the running ndn-fwd's CAs (make, list, withdraw; QR codes)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[[bin]]
name = "ndn-fwd-tokens"
path = "src/main.rs"

[dependencies]
ndn-cert = { workspace = true }
ndn-config = { workspace = true }
ndn-ipc = { workspace = true }
ndn-packet = { workspace = true, features = ["std"] }
ndn-security = { workspace = true }
ndn-trust-envelope = { workspace = true }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
clap   = { version = "4", features = ["derive"] }
anyhow = { workspace = true }
tokio  = { workspace = true, features = ["rt", "macros"] }

[lints]
workspace = true
