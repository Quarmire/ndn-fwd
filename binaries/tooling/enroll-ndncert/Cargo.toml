[package]
name = "enroll-ndncert"
description = "NDNCERT 0.3 enrollment helper — C.13 live CA interop witness tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
# See `docs/notes/scope-policy.md`.
classification = "tooling"

[[bin]]
name = "enroll-ndncert"
path = "src/main.rs"

[dependencies]
ndn-app      = { workspace = true }
ndn-cert     = { workspace = true }
ndn-packet   = { workspace = true, features = ["std"] }
ndn-security = { workspace = true }
bytes        = { workspace = true, features = ["std"] }
serde_json   = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std"] }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow       = { workspace = true }
getrandom    = "0.2"
