[package]
name = "ndn-tools"
description = "NDN command-line tools: ndn-peek, ndn-put, ndn-ping, ndn-ls"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "tooling"

[[bin]]
name = "ndn-peek"
path = "src/peek.rs"

[[bin]]
name = "ndn-put"
path = "src/put.rs"

[[bin]]
name = "ndn-ping"
path = "src/ping.rs"

[[bin]]
name = "ndn-sec"
path = "src/sec.rs"

[[bin]]
name = "ndn-ctl"
path = "src/ctl.rs"

[[bin]]
name = "ndn-traffic"
path = "src/traffic.rs"

[[bin]]
name = "ndn-iperf"
path = "src/iperf.rs"

[[bin]]
name = "ndn-psync-consumer"
path = "src/psync_consumer.rs"

[[bin]]
name = "ndn-mgmt-response-verify"
path = "src/mgmt_response_verify.rs"

[[bin]]
name = "ndn-mgmt-notification-fetch"
path = "src/mgmt_notification_fetch.rs"

[[bin]]
name = "ndn-safebag-witness"
path = "src/safebag_witness.rs"

[dependencies]
ndn-tools-core = { workspace = true, features = ["ping", "iperf", "peek", "put"] }
ndn-engine     = { workspace = true }
ndn-app        = { workspace = true }
ndn-ipc        = { workspace = true }
ndn-mgmt-wire  = { workspace = true }
ndn-packet     = { workspace = true, features = ["std"] }
ndn-security   = { workspace = true }
ndn-sync       = { workspace = true }
ndn-config     = { workspace = true }
ndn-transport  = { workspace = true }
ndn-face-native     = { workspace = true }
bytes          = { workspace = true, features = ["std"] }
base64         = { workspace = true, features = ["std"] }
serde          = { workspace = true }
serde_json     = { workspace = true }
tokio          = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "net", "io-util"] }
tokio-util     = { workspace = true, features = ["codec"] }
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow         = { workspace = true }
clap           = { version = "4", features = ["derive", "env"] }
