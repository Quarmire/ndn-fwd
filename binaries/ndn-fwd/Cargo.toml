[package]
name = "ndn-fwd"
description = "Standalone NDN forwarder binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "ndn-fwd"
path = "src/main.rs"

[features]
default = ["spsc-shm", "websocket", "serial", "l2", "webtransport"]
spsc-shm    = ["ndn-faces/spsc-shm"]
websocket   = ["ndn-faces/websocket", "dep:tokio-tungstenite"]
serial      = ["ndn-faces/serial"]
l2          = ["ndn-faces/l2"]
webtransport = ["dep:ndn-face-webtransport", "dep:ndn-acme", "dep:rustls-pemfile", "dep:sha2"]
yubikey-piv = ["ndn-security/yubikey-piv"]
# Enable tokio-console task inspector.
# Requires RUSTFLAGS="--cfg tokio_unstable" at build time (tokio requirement).
console     = ["dep:console-subscriber"]

[dependencies]
base64           = { workspace = true }
ndn-engine       = { workspace = true }
ndn-discovery    = { workspace = true, features = ["udp-hello", "ether-nd"] }
ndn-app          = { workspace = true }
ndn-faces        = { workspace = true }
ndn-face-webtransport = { workspace = true, optional = true }
ndn-acme              = { workspace = true, optional = true }
rustls-pemfile        = { workspace = true, optional = true }
sha2                  = { version = "0.10", optional = true }
ndn-strategy     = { workspace = true }
ndn-store        = { workspace = true }
ndn-security     = { workspace = true }
ndn-cert         = { workspace = true }
ndn-config       = { workspace = true }
ndn-routing      = { workspace = true }
getrandom        = "0.2"
ndn-packet       = { workspace = true, features = ["std"] }
ndn-transport    = { workspace = true }
bytes            = { workspace = true, features = ["std"] }
serde_json       = { workspace = true }
tokio            = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "io-util"] }
tokio-util           = { workspace = true, features = ["rt"] }
tokio-tungstenite    = { workspace = true, optional = true }
tracing              = { workspace = true }
tracing-subscriber   = { workspace = true }
tracing-appender     = "0.2"
console-subscriber   = { workspace = true, optional = true }
anyhow           = { workspace = true }
libc             = { workspace = true }
