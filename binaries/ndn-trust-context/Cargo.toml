[package]
name = "ndn-trust-context"
description = "Author a SignedTrustContext (anchors + LVS schema) and render it as an ndn-trust://anchor QR/NFC payload"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[lib]
name = "ndn_trust_context"
path = "src/lib.rs"

[[bin]]
name = "ndn-trust-context"
path = "src/main.rs"

[features]
default = ["os-keyring"]
# `--sign-key` naming a namespace root kept in the OS keychain / on a YubiKey.
os-keyring = ["ndn-cert/os-keyring"]
yubikey-piv = ["ndn-cert/yubikey-piv"]

[dependencies]
ndn-security = { workspace = true }
ndn-cert     = { workspace = true }
ndn-trust-envelope = { workspace = true }
ndn-packet   = { workspace = true, features = ["std"] }
bytes        = { workspace = true }
qrcode       = { version = "0.14", default-features = false, features = ["svg"] }
clap         = { version = "4", features = ["derive"] }
anyhow       = { workspace = true }
futures      = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
proptest = "1"

[lints]
workspace = true

[package.metadata.docs.rs]
# Build with every feature so the full API surface renders, and pass --cfg
# docsrs so any #[cfg_attr(docsrs, doc(cfg(...)))] items show their feature gate.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
