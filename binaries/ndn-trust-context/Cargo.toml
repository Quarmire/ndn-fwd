[package]
name = "ndn-trust-context"
description = "Author a SignedTrustContext (anchors + LVS schema) and render it as a QR/NFC join payload"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "extension"

[lib]
name = "ndn_trust_context"
path = "src/lib.rs"

[[bin]]
name = "ndn-trust-context"
path = "src/main.rs"

[dependencies]
ndn-security = { workspace = true }
ndn-packet   = { workspace = true, features = ["std"] }
bytes        = { workspace = true }
base64       = { workspace = true, features = ["std"] }
qrcode       = { version = "0.14", default-features = false, features = ["svg"] }
clap         = { version = "4", features = ["derive"] }
anyhow       = { workspace = true }
