# cargo-deny configuration — supply-chain gate for ndn-fwd.
# Run: cargo deny check        (advisories + licenses + bans + sources)
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# ndn-fwd pulls the ndn-rs + ndn-ext crates via `../` path deps, so it inherits
# the same transitive dependency graph; this policy mirrors ndn-rs/deny.toml.

[advisories]
# Each ignore is a reviewed decision, not a blanket suppression.
ignore = [
  # rsa "Marvin Attack" — a timing side-channel in RSA *decryption*. The stack
  # uses `rsa` only for signature signing/verification; there is no RSA
  # decryption oracle, so the attack surface is not reachable. No fixed upstream
  # version exists yet — re-evaluate when one ships.
  "RUSTSEC-2023-0071",
  # bincode 1.x unmaintained. Pulled only transitively by `rabe` under the
  # optional, off-by-default `abe` feature — absent from a default build.
  "RUSTSEC-2025-0141",
  # lru `IterMut` unsoundness (Stacked Borrows). The only caller (ndn-store's
  # LruCs) never calls `iter_mut`, so the unsound path is not exercised.
  "RUSTSEC-2026-0002",
  # rustls-pemfile unmaintained (now a thin wrapper over rustls-pki-types).
  "RUSTSEC-2025-0134",
  # quinn-proto out-of-order reassembly memory exhaustion. Reached only via
  # the optional WebTransport/QUIC face; tracked for a quinn bump. SECURITY: revisit.
  "RUSTSEC-2026-0185",
  # `Error::downcast_mut` unsoundness in a transitive dep; no exploitation path
  # in-tree. Revisit when the upstream fix lands.
  "RUSTSEC-2026-0190",
]

[licenses]
# Skip the workspace's own unpublished crates.
private = { ignore = true }
# Permissive set consistent with the workspace's own MIT OR Apache-2.0.
allow = [
  "MIT",
  "CDLA-Permissive-2.0",
  # xdpilone (AF_XDP lib, optional afxdp face) — copyleft EU license, used as an
  # unmodified library dep. POLICY: confirm copyleft is acceptable here.
  "EUPL-1.2",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions are a warning, not a hard failure (the rustcrypto 0.13/0.10
# split is a known, documented tradeoff in the workspace Cargo.toml).
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "allow"

# unescaper is dual GPL-3.0/MIT (deprecated `/` syntax); take the MIT arm.
[[licenses.clarify]]
crate = "unescaper"
expression = "MIT"
license-files = []
