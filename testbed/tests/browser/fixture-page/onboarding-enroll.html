<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Critical-path #4 onboarding-enroll fixture</title>
</head>
<body>
  <p>Critical-path #4 onboarding-enroll fixture — drives `EnrollClient` from Playwright.</p>
  <pre id="log"></pre>
  <script src="/sw-pkg/shared_engine.js"></script>
  <script>
    function log(msg) {
      const el = document.getElementById('log');
      el.textContent += msg + '\n';
      console.log('[enroll-tab]', msg);
    }
    (async () => {
      await wasm_bindgen('/sw-pkg/shared_engine_bg.wasm');
      const { EnrollClient } = wasm_bindgen;
      window.__enroll = await EnrollClient.open();
      log('EnrollClient ready');
      window.__enrollReady = true;
    })().catch((e) => {
      log('FATAL: ' + (e?.message ?? String(e)));
      window.__enrollReadyError = String(e);
    });
  </script>
</body>
</html>
