[package]
name = "ndn-e2e"
description = "End-to-end harness: runs real ndn-fwd daemons and CLI binaries through the personal-namespace life cycle (init, adopt, enroll, approve, renew, revoke, recovery) inside a throwaway user+network+PID namespace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.scope]
classification = "tooling"

[[bin]]
name = "ndn-e2e"
path = "src/main.rs"

[dependencies]
# Deterministic mistyped / swapped recovery words: the harness picks a variant
# whose BIP39 checksum fails, so the refusal it asserts is the checksum's.
bip39      = { version = "2.2", default-features = false, features = ["std"] }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt", "rt-multi-thread", "net", "signal", "macros", "time"] }
# The `approval` scenario's one fixture: a version of the trust context
# signed on the root device with the schema namespaces were created with
# before `#deny`/`#pending` (no CLI signs a chosen schema), handed to the
# root's daemon as `ndn-fwd revoke` hands its versions over.
ndn-cert     = { workspace = true }
ndn-ipc      = { workspace = true }
ndn-packet   = { workspace = true, features = ["std"] }
ndn-security = { workspace = true }
# The `negatives` scenario's tampered invite: a real invite whose link a
# sender altered to carry another namespace's fingerprint.
ndn-trust-envelope = { workspace = true }
# The `tui` scenario drives the admin TUI's state layer in process: a
# configuration whose `[ca]` entry states a link policy, the kinds of
# secret its prompts ask for.
ndn-tui = { path = "../../binaries/tooling/ndn-tui" }
ndn-config    = { workspace = true }
ndn-namespace = { workspace = true }

[lints]
workspace = true
