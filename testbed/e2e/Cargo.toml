[package]
name = "ndn-e2e"
description = "End-to-end harness: runs real ndn-fwd daemons and CLI binaries through the personal-namespace life cycle (init, adopt, enroll, approve, renew, revoke, recovery) inside a throwaway user+network+PID namespace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
# `cargo run -p ndn-e2e` runs the harness, not the `channels` scenario's device helper.
default-run = "ndn-e2e"

[package.metadata.scope]
classification = "tooling"

[[bin]]
name = "ndn-e2e"
path = "src/main.rs"

# The `channels` scenario's devices: one process each, an embedded forwarder, its links and a
# heap node (see the file's header for why a device cannot be an `ndn-fwd` daemon plus `ndn-heap`).
[[bin]]
name = "chan-device"
path = "src/bin/chan_device.rs"

[dependencies]
# Deterministic mistyped / swapped recovery words: the harness picks a variant
# whose BIP39 checksum fails, so the refusal it asserts is the checksum's.
bip39      = { version = "2.2", default-features = false, features = ["std"] }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt", "rt-multi-thread", "net", "signal", "macros", "time", "io-std", "io-util", "sync"] }
# The `approval` scenario's one fixture: a version of the trust context
# signed on the root device with the schema namespaces were created with
# before `#deny`/`#pending` (no CLI signs a chosen schema), handed to the
# root's daemon as `ndn-fwd revoke` hands its versions over.
ndn-cert     = { workspace = true }
ndn-ipc      = { workspace = true }
ndn-packet   = { workspace = true, features = ["std"] }
ndn-security = { workspace = true }
# The `negatives` scenario's tampered invite: a real invite whose link a
# sender altered to carry another namespace's fingerprint.
ndn-trust-envelope = { workspace = true }
# The `tui` scenario drives the admin TUI's state layer in process: a
# configuration whose `[ca]` entry states a link policy, the kinds of
# secret its prompts ask for.
ndn-tui = { path = "../../binaries/tooling/ndn-tui" }
ndn-config    = { workspace = true }
ndn-namespace = { workspace = true }
# The `shared` scenario reads a sealed entry as a relay fetched it
# (`ndn_heap::wire::Entry`): ciphertext beside its epoch, no path.
bytes      = { workspace = true }
ndn-heap   = { workspace = true, features = ["adversary"] }
# The `invite` scenario parses and mistypes the short code it was offered.
ndn-invite = { workspace = true }
# The `folder` scenario compares a large value read back with what was put,
# by its SHA-256 (`ndn-heap` shows large values by length and digest).
sha2       = { workspace = true }
# The `stolen` scenario answers `ndn-fwd revoke --lost` with the exact
# loss time it marked the phone suspected since (RFC 3339, milliseconds).
humantime = "2"
# `chan-device`: the embedded forwarder, its QUIC links and the heap node over them, and the
# `adversary` seam of ndn-heap (a key holder that forges a frame), which only this crate enables.
ndn-engine    = { workspace = true }
ndn-app       = { workspace = true }
ndn-link      = { workspace = true, features = ["engine"] }
ndn-face-quic = { workspace = true }
ndn-transport = { workspace = true }
ndn-sync      = { workspace = true }
tokio-util    = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
