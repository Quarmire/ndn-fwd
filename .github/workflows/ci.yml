name: CI — ndn-fwd

# PR gate: parallel, cache-backed jobs mirroring the ndn-rs A+ lane
# (fmt+clippy, nextest, rustdoc, MSRV, wasm, cargo-deny, semver-checks).
#
# ndn-fwd depends on ndn-rs + ndn-ext via `../` path deps, so every build job
# checks them out as siblings (ndn-rs/ + ndn-ext/ next to ndn-fwd/). When the
# repos are released, switch those path deps to { git, tag } and drop the
# sibling checkouts.
#
# Toolchain: rust-toolchain.toml (in ndn-fwd/) pins 1.96 + the wasm target;
# rustup auto-installs it on first cargo invocation, so jobs need no explicit
# toolchain action (the MSRV job overrides deliberately).
#
# Host compile jobs run the default-members set. (dioxus-demo moved to the
# ndn-dashboard repo in P1, taking its wasm32 job and WebKitGTK deps with it.)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: ndn-fwd

env:
  CARGO_TERM_COLOR: always
  # Escalate warnings — including the [workspace.lints] table — to errors.
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: bc638999df8c24d51dddcf63ed4110fd2195adc4, path: ndn-radio-drivers }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-fwd
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scope fmt to ndn-fwd's own members: `cargo fmt --all` also formats
      # local path-based dependencies (the sibling ndn-rs/ndn-ext crates),
      # which are not this repo's responsibility.
      - name: rustfmt (ndn-fwd members)
        run: |
          PKGS=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(' '.join('-p '+p['name'] for p in json.load(sys.stdin)['packages']))")
          cargo fmt $PKGS -- --check
      - name: clippy (default-members, all targets)
        run: cargo clippy --all-targets

  test:
    name: tests (nextest + doctests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: bc638999df8c24d51dddcf63ed4110fd2195adc4, path: ndn-radio-drivers }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-fwd
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: nextest (unit + integration)
        run: cargo nextest run --profile ci
      - name: doctests (nextest does not run these)
        run: cargo test --doc

  docs:
    name: rustdoc (broken links are errors)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: bc638999df8c24d51dddcf63ed4110fd2195adc4, path: ndn-radio-drivers }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-fwd
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --no-deps

  msrv:
    name: MSRV (1.90)
    runs-on: ubuntu-latest
    env:
      # MSRV verifies "compiles on the oldest supported compiler", not
      # "warning-free there" — older rustc emits warnings newer ones don't.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: bc638999df8c24d51dddcf63ed4110fd2195adc4, path: ndn-radio-drivers }
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-fwd
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check on rust-version
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "MSRV from Cargo.toml: $MSRV"
          rustup toolchain install "$MSRV" --profile minimal
          cargo "+$MSRV" check

  deny:
    name: cargo-deny (advisories + licenses + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: bc638999df8c24d51dddcf63ed4110fd2195adc4, path: ndn-radio-drivers }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # The blocking gate checks the deterministic parts. Advisories are a
      # moving target (new RUSTSEC entries land for transitive deps constantly),
      # so they belong in a scheduled/nightly job, not the per-push gate — and
      # gating on them tempts blindly suppressing real CVEs. Known advisories are
      # tracked (with rationale) in deny.toml's [advisories].ignore.
      - name: cargo deny check (bans + licenses + sources)
        run: cargo deny check bans licenses sources

  semver:
    name: semver-checks (ndn-fwd library crates)
    runs-on: ubuntu-latest
    # PRs only: compares the PR's public API against the merge-base. Skipped on
    # push (no baseline to diff against).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          path: ndn-fwd
          fetch-depth: 0
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 36f4394884bdf7729909edc842649aca8c212db2, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 76e913dcef511a3c1d76186289a53376a83a2efa, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: bc638999df8c24d51dddcf63ed4110fd2195adc4, path: ndn-radio-drivers }
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ndn-fwd
          shared-key: semver
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: cargo-semver-checks vs merge-base
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          cargo semver-checks \
            --baseline-rev "$BASE" \
            -p ndn-pib-idb -p ndn-acme -p ndn-tools-core -p ndn-trust-context
