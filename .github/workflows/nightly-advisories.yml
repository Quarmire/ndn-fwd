name: Nightly — advisories

# The per-push CI deny gate checks the deterministic parts (bans + licenses +
# sources). Advisories are a moving target — new RUSTSEC entries land for
# transitive deps constantly — so they run here on a schedule rather than
# blocking every push (and to avoid blindly suppressing real CVEs to keep a PR
# green).
#
# `--all-features` so feature-gated deps are covered. Reviewed/triaged advisories
# are tracked with rationale in deny.toml's [advisories].ignore; a RED run here
# means a NEW advisory landed and needs a look (bump the dep, or add a documented
# ignore).

on:
  schedule:
    - cron: "42 6 * * *" # 06:42 UTC daily (offset from ndn-ext's)
  workflow_dispatch:

concurrency:
  group: nightly-advisories
  cancel-in-progress: true

defaults:
  run:
    working-directory: ndn-fwd

jobs:
  advisories:
    name: cargo-deny advisories (--all-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: 74beb638d3ba7c5654140f827010c6c22b57227f, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 6de852365eb73c0c5007bf4e26069d0afb8751a6, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-radio-drivers (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: 59375bb27c235f98a9de86d175a4e774cf3c03a9, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        # pinned sibling; ndn-fwd path-deps ndn-radio's named-radio medium face
        # (ndn-phy-wifi / ndn-radio-cognition / ndn-coding)
        with: { repository: "${{ github.repository_owner }}/ndn-radio", ref: defe18acfabfe757b2f20b39e9fb652a1340722b, path: ndn-radio }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check advisories (--all-features)
        run: cargo deny --all-features check advisories
