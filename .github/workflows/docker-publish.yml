name: Docker — publish ndn-fwd

# The Docker build needs ndn-rs, ndn-ext, ndn-radio, and ndn-radio-drivers as
# siblings (ndn-fwd path-deps them), so this job checks them out next to each
# other and builds with that parent directory as the context. The Dockerfile
# reproduces the layout under /workspace.

on:
  push:
    branches: [main]
    paths: ["binaries/ndn-fwd/**", "crates/**", "Cargo.toml", ".github/workflows/docker-publish.yml"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ndn-fwd

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { path: ndn-fwd }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-rs (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-rs", ref: de09ff6ae8a77ae0f3ddf14d20c4ac4c6f169df8, path: ndn-rs }
      - uses: actions/checkout@v4
        # pinned sibling; bump deliberately when adopting newer ndn-ext (see workspace STATE.md)
        with: { repository: "${{ github.repository_owner }}/ndn-ext", ref: 27646a78bb0fd91a7f1fba1f295d5a9ad220fef6, path: ndn-ext }
      - uses: actions/checkout@v4
        # pinned sibling; needed since P2/D5 — ndn-ext's radio faces resolve
        # ndn-frame-io/ndn-radio-hal/ndn-env from ndn-radio-drivers/crates/
        with: { repository: "${{ github.repository_owner }}/ndn-radio-drivers", ref: 05862c948e33f7e2ad8091d8729a5cee6fdfcba0, path: ndn-radio-drivers }
      - uses: actions/checkout@v4
        # pinned sibling; ndn-fwd path-deps ndn-radio's named-radio medium face
        # (ndn-phy-wifi / ndn-radio-cognition / ndn-coding)
        with: { repository: "${{ github.repository_owner }}/ndn-radio", ref: b4c3d96817ea4c8e50aaeeedca47462c5ac4054e, path: ndn-radio }
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ndn-fwd/binaries/ndn-fwd/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
