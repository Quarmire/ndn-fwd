name: Docker — publish ndn-fwd

# NOTE: the Docker build needs ndn-rs + ndn-ext available to the build context.
# With the current `../` path deps that requires a multi-repo context; the clean
# fix is to switch cross-repo deps to { git, tag } so cargo fetches them inside
# the image. Until then this workflow is wired but will only succeed once those
# deps resolve without sibling directories (e.g. git deps).

on:
  push:
    branches: [main]
    paths: ["binaries/ndn-fwd/**", "crates/**", "Cargo.toml", ".github/workflows/docker-publish.yml"]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ndn-fwd

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: binaries/ndn-fwd/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
