[package]
name = "ndn-dashboard"
description = "NDN router management dashboard (desktop and web via Dioxus)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "tooling"

[[bin]]
name = "ndn-dashboard"
path = "src/main.rs"

# Library target. Carries no production code on its own — exists so
# `cargo build`/`wasm-pack build` can produce a `cdylib` exposing the
# witness-export surface (`src/witness_export.rs`) for the browser-side
# witness in `testbed/tests/browser/wsmgmt_wire.spec.ts`. Empty when the
# `witness-export` feature is off, so the bin build is unaffected.
[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = [
  "ndn-dashboard-core/desktop",
  "dep:tray-icon",
  "dep:dirs-next",
  "dep:which",
  "dep:arboard",
  "dep:keyring",
  "dep:ndn-ipc",
  "dep:ndn-app",
  "dep:ndn-tools-core",
  "dep:ndn-config",
  "dep:ndn-trust-envelope",
  "dep:qrcode",
  "dioxus/desktop",
  "tokio/process",
  "tokio/rt-multi-thread",
  "ndn-packet/std",
  "ndn-tlv/std",
]
web = [
  "ndn-dashboard-core/web",
  "dioxus/web",
  "dep:gloo-net",
  "dep:web-sys",
  "dep:gloo-storage",
  "dep:gloo-timers",
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-time",
  "dep:ndn-config",
  "ndn-packet/std-wasm",
  "ndn-tlv/std",
  "getrandom/js",
]
# In-page ndn-engine (Phase 7). Activated by `?engine=local` query
# string at runtime; the dashboard hosts a `ForwarderEngine` inside
# the browser tab instead of speaking WebSocket to a remote
# forwarder. Requires `web`.
browser-engine = [
  "web",
  "dep:ndn-engine",
  "dep:ndn-mgmt",
  "dep:ndn-config",
  "ndn-config/mgmt",
  "dep:ndn-runtime",
  "dep:ndn-transport",
  "dep:ndn-coding",
  "dep:ndn-ratelimit",
  "dep:ndn-face-webble",
  "dep:wasm-bindgen-futures",
  "dep:web-time",
  "dep:tokio-util",
]
# Browser-side witness surface (Tier-1 §2c, native counterpart is
# `crates/ndn-mgmt/tests/web_wire_e2e.rs`). Exposes the
# dashboard's `WsMgmtClient` to JS via `wasm-bindgen` so Playwright
# can drive `/localhost/nfd/{module}/{verb}` against a real `ndn-fwd`
# over a real browser WebSocket. Off by default; enabled only when
# `testbed/tests/browser/build-dashboard-witness.sh` runs.
witness-export = [
  "web",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:ndn-config",
]

[dependencies]
# UI-agnostic logic + data models (operator keyring/custodian, trust/audit
# chains, forwarder profile, the data structs the UI renders). Dioxus-free.
ndn-dashboard-core = { git = "https://github.com/Quarmire/ndn-ext", tag = "v0.1.0-alpha.1" }
ndn-config = { workspace = true, optional = true }
ndn-mgmt-wire = { workspace = true }
# Wasm-safe Custodian trait + CustodianRef (the canonical "where the key lives"
# vocabulary) — backs the Trust Context machine-trust surfacing.
# default-features = false drops sqlite-pib so the web target stays wasm-safe;
# used by operator_keyring to hold the dashboard's own Ed25519 signing key.
ndn-security = { git = "https://github.com/Quarmire/ndn-rs", tag = "v0.1.0-alpha.1", default-features = false, features = ["custodian"] }
# Desktop gets full std (with ring/blake3); web gets std-wasm (no native crypto)
ndn-packet = { workspace = true }
ndn-tlv    = { workspace = true }
bytes      = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["rt", "macros", "time", "io-util"] }
futures    = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow     = { workspace = true }
async-trait = { workspace = true }
dioxus     = "0.7"
base64     = { workspace = true }
getrandom  = "0.2"
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
toml       = "0.8"

# Desktop-only dependencies (optional, activated by "desktop" feature)
tray-icon      = { version = "0.21", optional = true }
dirs-next      = { version = "2", optional = true }
which          = { version = "6", optional = true }
arboard        = { version = "3", optional = true }
# OS keychain (Touch ID / Windows Hello / Secret Service) for the
# device-bound second factor — seals the operator key without a typed
# password. Native backends only (no extra system daemons on macOS).
keyring        = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
ndn-ipc        = { workspace = true, optional = true }
# NDN consumer for the remote-signer transport: send a WireSignRequest Interest
# to the paired phone's `…/signer` responder over the same forwarder socket.
ndn-app        = { workspace = true, optional = true }
ndn-tools-core = { workspace = true, features = ["ping", "iperf", "peek", "put"], optional = true }
# The shared `ndn-trust://` envelope codec (capability request/grant) + a pure-Rust
# QR renderer for the Pairing screen's request code. Desktop-only (the pairing
# flow binds a phone fob to this operator console).
ndn-trust-envelope = { git = "https://github.com/Quarmire/ndn-ext", tag = "v0.1.0-alpha.1", optional = true }
qrcode         = { version = "0.14", default-features = false, features = ["svg"], optional = true }

# ed25519-dalek powers the DashboardSigner used to sign every chain
# entry (audit log + schema journal). Available on every target —
# native uses the std signing path, wasm32 uses the same crate
# (works without OS RNG via getrandom/js).
ed25519-dalek  = { workspace = true }

# ndn-safebag is the wasm-buildable parse/decrypt surface for the
# ndn-cxx-compatible SafeBag (TLV 0x80). Powers the §5.1 drag-drop
# import modal's local preview + trust check; the modal decodes the
# dropped file in-browser so the operator sees identity/key/cert
# *before* committing the wire.

# Web-only dependencies (optional, activated by "web" feature)
gloo-net     = { version = "0.6", optional = true }
gloo-storage = { version = "0.3", optional = true }
gloo-timers  = { version = "0.3", optional = true }
js-sys       = { version = "0.3", optional = true }

# Browser-engine-only dependencies (optional, activated by
# "browser-engine" feature on wasm32 web target).
ndn-engine    = { workspace = true, optional = true }
ndn-mgmt      = { workspace = true, optional = true }
ndn-runtime   = { workspace = true, optional = true }
ndn-transport = { workspace = true, optional = true }
ndn-coding    = { workspace = true, optional = true }
ndn-ratelimit = { workspace = true, optional = true }
ndn-face-webble = { workspace = true, optional = true }
wasm-bindgen        = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-time      = { version = "1", optional = true }
tokio-util    = { workspace = true, features = ["rt"], optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
  "Window",
  "Storage",
  "Navigator",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbObjectStoreParameters",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbRequestReadyState",
  "IdbTransaction",
  "IdbTransactionMode",
  "IdbVersionChangeEvent",
  "WorkerGlobalScope",
  "DomException",
  "Event",
]

# macOS gets the real biometric path: a keychain item gated by Touch ID /
# device passcode (USER_PRESENCE), via Security.framework directly — the
# `keyring` crate stores login-keychain items without per-use biometric.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
ed25519-dalek = { workspace = true }
