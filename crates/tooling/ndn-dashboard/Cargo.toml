[package]
name = "ndn-dashboard"
description = "NDN router management dashboard (desktop and web via Dioxus)"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
# See `docs/notes/scope-policy.md`.
classification = "tooling"

[[bin]]
name = "ndn-dashboard"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = [
  "dep:tray-icon",
  "dep:dirs-next",
  "dep:which",
  "dep:ndn-ipc",
  "dep:ndn-tools-core",
  "dep:ndn-config",
  "dioxus/desktop",
  "tokio/process",
  "tokio/rt-multi-thread",
  "ndn-packet/std",
  "ndn-tlv/std",
]
web = [
  "dioxus/web",
  "dep:gloo-net",
  "dep:web-sys",
  "dep:gloo-storage",
  "dep:gloo-timers",
  "ndn-packet/std-wasm",
  "ndn-tlv/std",
  "getrandom/js",
]
# In-page ndn-engine (Phase 7). Activated by `?engine=local` query
# string at runtime; the dashboard hosts a `ForwarderEngine` inside
# the browser tab instead of speaking WebSocket to a remote
# forwarder. Requires `web`.
browser-engine = [
  "web",
  "dep:ndn-engine",
  "dep:ndn-mgmt",
  "dep:ndn-config",
  "dep:ndn-runtime",
  "dep:ndn-transport",
  "dep:wasm-bindgen-futures",
  "dep:web-time",
  "dep:tokio-util",
]

[dependencies]
ndn-config = { workspace = true, optional = true }
# Desktop gets full std (with ring/blake3); web gets std-wasm (no native crypto)
ndn-packet = { workspace = true }
ndn-tlv    = { workspace = true }
bytes      = { workspace = true, features = ["std"] }
tokio      = { workspace = true, features = ["rt", "macros", "time", "io-util"] }
futures    = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow     = { workspace = true }
dioxus     = "0.7"
getrandom  = "0.2"
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Desktop-only dependencies (optional, activated by "desktop" feature)
tray-icon      = { version = "0.21", optional = true }
dirs-next      = { version = "2", optional = true }
which          = { version = "6", optional = true }
ndn-ipc        = { workspace = true, optional = true }
ndn-tools-core = { workspace = true, features = ["ping", "iperf", "peek", "put"], optional = true }

# Web-only dependencies (optional, activated by "web" feature)
gloo-net     = { version = "0.6", optional = true }
gloo-storage = { version = "0.3", optional = true }
gloo-timers  = { version = "0.3", optional = true }

# Browser-engine-only dependencies (optional, activated by
# "browser-engine" feature on wasm32 web target).
ndn-engine    = { workspace = true, optional = true }
ndn-mgmt      = { workspace = true, optional = true }
ndn-runtime   = { workspace = true, optional = true }
ndn-transport = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-time      = { version = "1", optional = true }
tokio-util    = { workspace = true, features = ["rt"], optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = ["Window", "Storage"]
