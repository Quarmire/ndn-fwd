# Education seam — single source of truth for the dashboard's
# user-visible glosses of NDN terms (§9 / §9.1 of the security
# design). Every `EduGloss { term: "X", ... }` callsite in the
# dashboard must have a matching `term` entry below; the
# `dash-glossary` CI tool enforces it.
#
# Fields:
#   term         — exact string passed to the EduGloss component.
#   gloss        — single sentence, ≤120 chars. Tooltip text.
#   extended     — optional second sentence, shown when the gloss is
#                  expanded inline at first appearance in a flow.
#   wiki_anchor  — anchor in docs/wiki/src to deep-link to. The wiki
#                  builder regenerates a glossary section from this file
#                  so the same prose surfaces in both places.

[[entries]]
term = "Trust anchor"
gloss = "A root certificate the forwarder treats as authoritative."
extended = "Anything signed by a chain leading back to this cert is accepted."
wiki_anchor = "trust-anchors"

[[entries]]
term = "Schema rule"
gloss = "A pattern that says which key is allowed to sign data at this name."
wiki_anchor = "trust-schemas"

[[entries]]
term = "Identity"
gloss = "A named principal (like '/alice'). Owns keys and signs data and commands as itself."
wiki_anchor = "identities"

[[entries]]
term = "Key"
gloss = "A key pair. Public part appears in certs; private part is used to sign."
wiki_anchor = "keys"

[[entries]]
term = "Cert"
gloss = "A signed Data packet that binds an identity-key pair to a validity window and issuer."
wiki_anchor = "certificates"

[[entries]]
term = "CA"
gloss = "A namespace authority — issues certs under its namespace via the NDNCERT protocol."
wiki_anchor = "ndncert"

[[entries]]
term = "KeyLocator"
gloss = "The pointer inside a signed packet that says 'this is the key that signed me'."
extended = "Validators follow the KeyLocator to fetch the signing cert."
wiki_anchor = "signed-data"

[[entries]]
term = "NDNCERT"
gloss = "The challenge-response protocol for getting a cert from a CA."
wiki_anchor = "ndncert"

[[entries]]
term = "DigestSha256"
gloss = "Integrity-only signing — proves bytes weren't tampered with, doesn't prove who signed."
wiki_anchor = "signatures"

[[entries]]
term = "Trust path"
gloss = "The chain of certs from a signed packet's KeyLocator up to a trust anchor."
extended = "When the chain is unbroken and every link satisfies a schema rule, the packet validates."
wiki_anchor = "trust-paths"

[[entries]]
term = "MgmtAccessPolicy"
gloss = "The forwarder's runtime security policy — which commands need signing, which validators apply."
extended = "Forwarder-internal config in v1; edits are bridged into the audit log so policy history is reconstructable."
wiki_anchor = "mgmt-access"

[[entries]]
term = "Ephemeral identity"
gloss = "An in-memory signing key that disappears on restart — no continuity across runs."
wiki_anchor = "identities"

[[entries]]
term = "Audit log"
gloss = "Append-only signed-Data chain of security-relevant events the dashboard observes."
extended = "Each entry is a signed NDN Data packet at /<operator>/audit/seq=N with prev_entry_hash linkage and NDN-TLV Content."
wiki_anchor = "audit-log"

[[entries]]
term = "Schema journal"
gloss = "Append-only signed-Data chain of trust-anchor and schema-rule changes (who changed what, when)."
wiki_anchor = "schema-journal"

[[entries]]
term = "Signed Data chain"
gloss = "A sequence of signed NDN Data packets linked by content_hash, indexed by typed SequenceNumber name components."
extended = "Dashboard primitive backing both the audit log and the schema journal; forward-compatible with substrate-replicated chains."
wiki_anchor = "signed-data-chain"

[[entries]]
term = "Signed Data"
gloss = "An NDN Data packet carrying a SignatureValue plus a KeyLocator that points at the signing key's cert."
wiki_anchor = "signed-data"

[[entries]]
term = "Signed Interest"
gloss = "An NDN Interest carrying a SignatureValue + SignatureTime over its name, used for management commands and other authenticated actions."
wiki_anchor = "signed-interests"

[[entries]]
term = "TOFU"
gloss = "Trust-on-first-use — accept the fingerprint once after out-of-band verification, then refuse silent changes."
extended = "Same trust model SSH host keys use; the dashboard journals the decision so it's reviewable later."
wiki_anchor = "tofu"

[[entries]]
term = "Verification method"
gloss = "A key entry inside a DID Document — what's allowed to sign as that DID."
extended = "Each verification method has an id, a type (Ed25519VerificationKey2020, JsonWebKey2020, …), and a controller."
wiki_anchor = "did-verification-methods"

[[entries]]
term = "Controller"
gloss = "A DID authorized to update or deactivate another DID Document."
extended = "Absent controller means the subject controls itself. In NDN the controller is typically the parent namespace's DID."
wiki_anchor = "did-controllers"

[[entries]]
term = "Service endpoint"
gloss = "A location (NDN prefix, URL, …) where this DID's data or interactions live."
wiki_anchor = "did-service-endpoints"

[[entries]]
term = "Resolve DID"
gloss = "Fetch and verify a DID Document — follow the KeyLocator, validate the chain, decode the document."
extended = "The resolution trace shows each step (fetch / verify / decode); the dashboard's L2 framing wraps the L1 cert-chain trace."
wiki_anchor = "did-resolution"

[[entries]]
term = "DID extension"
gloss = "A non-W3C-canonical field a DID Document carries (substrate-specific posture, deployment metadata, …)."
extended = "Renderers register at startup; unknown extension keys fall back to a 'Show raw' affordance."
wiki_anchor = "did-extensions"

[[entries]]
term = "SafeBag"
gloss = "ndn-cxx-compatible identity-export envelope — a TLV that bundles a cert with the encrypted private key."
extended = "Drag a .tpb file onto the dashboard to import the identity; the encryption passphrase decrypts the wrapped PKCS#8 key."
wiki_anchor = "safebag"

[[entries]]
term = "ChallengeHandler"
gloss = "The NDNCERT stage that decides whether your proof (token, email code, …) satisfies the CA's identity-verification challenge."
extended = "Second of three gatekeepers in NDNCERT issuance — NamespacePolicy → ChallengeHandler → IssuancePolicy."
wiki_anchor = "ndncert"

[[entries]]
term = "IssuancePolicy"
gloss = "The NDNCERT stage that decides what cert to actually issue — validity cap, algorithm, issuer KeyLocator."
extended = "Third gatekeeper after NamespacePolicy + ChallengeHandler; pluggable via the F.7 registry hook in ndn-cert."
wiki_anchor = "ndncert"

[[entries]]
term = "Key rotation"
gloss = "Generate a new signing key under the same identity; the old key stays for in-flight verification until manually deleted."
extended = "Recorded in the audit log so the chain documents when the rotation happened and who initiated it."
wiki_anchor = "key-rotation"

[[entries]]
term = "ChallengeAttestation"
gloss = "A record the CA writes into the cert's signed AdditionalDescription saying which challenge the subject satisfied (and how)."
extended = "Lets the IssuancePolicy gate on the challenge kind — e.g. RequireAttestationKind('/high-trust', 'device-approval') rejects issuance unless the named challenge was used."
wiki_anchor = "challenge-attestations"

[[entries]]
term = "Device approval"
gloss = "An NDNCERT challenge type where an already-approved device authorises a new enrollment by publishing a signed approval Data on the CA's approval feed."
extended = "Pending requests surface in the dashboard via ca/list-approvals; resolution happens off-mgmt via the canonical signed-Data path."
wiki_anchor = "device-approval"
