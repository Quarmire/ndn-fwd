[package]
name = "ndn-dashboard-next"
description = "Next-generation NDN dashboard with browser-first observability, trust, tools, and engine views"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.scope]
classification = "tooling"

[[bin]]
name = "ndn-dashboard-next"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["desktop"]
desktop = ["dioxus/desktop", "tokio/rt-multi-thread"]
web = [
  "dioxus/web",
  "dep:console_error_panic_hook",
  "getrandom/js",
]

[dependencies]
dioxus = "0.7"
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8"
bytes = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
getrandom = "0.2"
console_error_panic_hook = { version = "0.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "CssStyleDeclaration", "Document", "Element", "HtmlAnchorElement", "HtmlElement", "Node", "Storage", "Url", "Window"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ndn-app = { workspace = true }
ndn-cert = { workspace = true }
ndn-identity = { workspace = true }
ndn-ipc = { workspace = true }
ndn-security = { workspace = true }
ndn-packet = { workspace = true }
ndn-tools-core = { workspace = true, features = ["iperf", "peek", "ping", "put"] }
