[package]
name = "ndn-tools-core"
description = "Core library for NDN tools — embeddable in applications and dashboards"
version.workspace = true
edition.workspace = true
license.workspace = true

[package.metadata.scope]
classification = "tooling"

[features]
default = []
ping    = []
# Active hop-distance traceroute; probes a ping-style responder, so it pulls `ping`.
traceroute = ["ping"]
iperf   = []
peek    = []
put     = []
send    = []
recv    = []

[dependencies]
ndn-app        = { workspace = true }
ndn-ipc        = { workspace = true }
ndn-ipc-shm    = { workspace = true }
ndn-packet     = { workspace = true, features = ["std"] }
ndn-security   = { workspace = true }
ndn-transport  = { workspace = true }
tokio          = { workspace = true, features = ["rt", "sync", "time"] }
anyhow         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
bytes          = { workspace = true, features = ["std"] }
tracing        = { workspace = true }

[lints]
workspace = true
