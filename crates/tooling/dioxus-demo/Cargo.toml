[package]
name = "dioxus-demo"
description = "Phase 4 in-browser ndn-rs demo: WebTransport face + Dioxus consumer/producer panels"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.scope]
classification = "tooling"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["web"]
web = [
  "dioxus/web",
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:gloo-timers",
  "dep:web-sys",
  "dep:console_error_panic_hook",
  # NDNCERT onboarding (the Join panel): IdbPib persistence + SafeBag wrapping.
  "dep:ndn-pib-idb",
  "ndn-packet/std-wasm",
  "ndn-tlv/std",
  "getrandom/js",
]
# Phase 6: enable the SharedWorker entrypoint (`worker_main`) and the
# tab-side proxy face. Disabled in `web` so the dioxus tab build stays
# light; the shared-engine bundle is a separate `dx`/wasm-pack target
# that ships only the worker entrypoint + face plumbing.
shared-engine = [
  "dep:wasm-bindgen",
  "dep:wasm-bindgen-futures",
  "dep:web-sys",
  "dep:js-sys",
  "dep:console_error_panic_hook",
  "dep:ndn-face-shared-worker",
  "dep:ndn-pib-idb",
  "ndn-packet/std-wasm",
  "ndn-tlv/std",
  "getrandom/js",
]

[dependencies]
dioxus     = "0.7"
bytes      = { workspace = true, features = ["std"] }
futures    = { workspace = true }
tokio      = { workspace = true, features = ["sync", "macros"] }
web-time   = "1"
sha2       = { version = "0.10", default-features = false }
tracing    = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
getrandom  = "0.2"

ndn-packet    = { workspace = true }
ndn-tlv       = { workspace = true }
ndn-runtime   = { workspace = true }
ndn-transport = { workspace = true }
ndn-engine    = { workspace = true }
ndn-mgmt      = { workspace = true }
ndn-config    = { workspace = true, features = ["mgmt"] }
ndn-store     = { workspace = true }
ndn-face-webtransport-wasm = { workspace = true }
ndn-cert      = { path = "../../../../ndn-rs/crates/security/ndn-cert", default-features = false, features = ["wasm-client"] }
ndn-security  = { path = "../../../../ndn-rs/crates/security/ndn-security", default-features = false }
ndn-face-webrtc = { workspace = true }
ndn-face-shared-worker = { workspace = true, optional = true }
ndn-pib-idb            = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["rt"] }

wasm-bindgen              = { version = "0.2", optional = true }
wasm-bindgen-futures      = { version = "0.4", optional = true }
js-sys                    = { version = "0.3", optional = true }
gloo-timers               = { version = "0.3", features = ["futures"], optional = true }
console_error_panic_hook  = { version = "0.1", optional = true }

[dependencies.web-sys]
version = "0.3"
optional = true
features = ["Window", "console", "Location"]

[lints]
workspace = true
